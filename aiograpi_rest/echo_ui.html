<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:rgba(15,31,50,.72);--line:rgba(255,255,255,.08);--txt:#eef5ff;--muted:#93a8bd;--accent:#58baff;--good:#45d58a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.45 Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(60,130,220,.17),transparent 34%),linear-gradient(180deg,#07111f,#0a1726);color:var(--txt)}.shell{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e2f5ff 0 8%,#56bfff 25%,#245bff 68%,#18305d);box-shadow:0 0 28px rgba(75,175,255,.3)}h1,h2{margin:0}.sub,.note,.meta{color:var(--muted)}.pill,.btn,.input,.textarea{border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(18px)}.pill{padding:8px 11px;border-radius:999px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px}.glass{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(20,40,64,.65),rgba(9,24,40,.67));box-shadow:0 18px 50px rgba(0,0,0,.22);backdrop-filter:blur(22px)}.feed-head{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.filters{display:flex;gap:7px;flex-wrap:wrap}.btn{color:#d5e3f0;padding:8px 11px;border-radius:11px;cursor:pointer}.btn:hover{background:rgba(255,255,255,.09)}.btn.active,.primary{background:rgba(88,186,255,.15);border-color:rgba(88,186,255,.3);color:white}.feed{padding:0 10px 10px}.empty{margin:8px;padding:44px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:16px;color:var(--muted)}.post{display:grid;grid-template-columns:82px 1fr auto;gap:14px;padding:14px;margin:7px 0;border-radius:17px;background:rgba(255,255,255,.025)}.thumb{width:82px;height:82px;border-radius:13px;object-fit:cover;background:#102034}.caption{margin-top:7px;color:#dce7f1}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:750;background:rgba(255,255,255,.08)}.settings{padding:18px;position:sticky;top:20px;height:max-content}.section{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}.label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#96abc0;margin-bottom:7px}.input,.textarea{width:100%;border-radius:12px;padding:10px 11px;color:#eef5ff;outline:none}.textarea{min-height:88px;resize:vertical}.row{display:flex;gap:7px}.items{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);font-size:12px}.objective{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}.objective b{font-size:12px}.objective .x{float:right}.x{border:0;background:none;color:#7f94a8;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(9,23,38,.94);opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:translateY(0)}a{color:inherit;text-decoration:none}@media(max-width:860px){.grid{grid-template-columns:1fr}.settings{position:static}.post{grid-template-columns:70px 1fr}.thumb{width:70px;height:70px}.score{grid-column:2}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><div class="orb"></div><div><h1>Echo</h1><div class="sub">Quiet social monitoring</div></div></div><div class="pill"><span class="dot"></span><span id="statusText">Connected</span></div></header><div class="grid"><section class="glass"><div class="feed-head"><h2>Signals</h2><div class="filters" id="filters"></div></div><div class="feed" id="feed"><div class="empty">No signals yet. Echo will populate this feed after scans begin.</div></div></section><aside class="glass settings"><h2>Monitoring</h2><div class="section"><label class="label">Objectives</label><textarea class="textarea" id="objectiveInput" placeholder="Describe what Echo should find, e.g. Find complaints about the travel experience even without an explicit brand mention"></textarea><div class="row" style="margin-top:7px"><input class="input" id="priorityInput" type="number" min="0" max="100" value="50" style="max-width:86px"><button class="btn primary" onclick="addObjective()">Add objective</button></div><div id="objectives"></div><div class="note">Objectives are stored now; semantic matching will use a free local model in the next layer.</div></div><div class="section"><label class="label">Sources</label><div class="row"><input class="input" id="sourceInput" placeholder="instagram username"><button class="btn primary" onclick="addSource()">Add</button></div><div class="items" id="sources"></div></div><div class="section"><label class="label">Keywords</label><div class="row"><input class="input" id="keywordInput" placeholder="keyword"><input class="input" id="weightInput" type="number" min="0" max="100" value="25" style="max-width:72px"><button class="btn primary" onclick="addKeyword()">Add</button></div><div class="items" id="keywords"></div></div><div class="section"><label class="label">Configuration access</label><input class="input" id="adminKey" type="password" placeholder="Echo admin key" autocomplete="off"></div></aside></div></main><div class="toast" id="toast"></div>
<script>
let currentFilter='ALL';const levels=['ALL','ALTA','MEDIA','BASSA','SCARTATA'],filters=document.getElementById('filters');levels.forEach(l=>{const b=document.createElement('button');b.className='btn'+(l==='ALL'?' active':'');b.textContent=l==='ALL'?'All':l;b.onclick=()=>{currentFilter=l;document.querySelectorAll('#filters .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadFeed()};filters.appendChild(b)});const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function adminHeaders(){const k=document.getElementById('adminKey').value.trim();return {'Content-Type':'application/json',...(k?{'X-Echo-Admin-Key':k}:{})}}async function api(path,opts={}){const r=await fetch(path,opts);if(!r.ok){let m='Request failed';try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r.status===204?null:r.json()}
async function loadFeed(){try{const q=currentFilter==='ALL'?'':'?relevance='+currentFilter,d=await api('/echo/feed'+q),el=document.getElementById('feed');if(!d.items.length){el.innerHTML='<div class="empty">No signals yet. Echo will populate this feed after scans begin.</div>';return}el.innerHTML=d.items.map(p=>`<a class="post" href="${esc(p.permalink||'#')}" target="_blank"><img class="thumb" src="${esc(p.thumbnail_url||'')}"><div><b>@${esc(p.username)}</b><div class="meta">${p.published_at?new Date(p.published_at).toLocaleString():''}</div><div class="caption">${esc(p.caption||'')}</div></div><div class="score"><span class="tag">${esc(p.relevance)}</span><div class="meta">${Number(p.relevance_score||0)}/100</div></div></a>`).join('')}catch(e){statusText.textContent='Unavailable';toast(e.message)}}
async function loadSources(){try{const d=await api('/echo/sources');sources.innerHTML=d.items.map(s=>`<span class="chip">@${esc(s.username)}<button class="x" onclick="removeSource('${s.id}')">×</button></span>`).join('')}catch(e){toast(e.message)}}async function loadKeywords(){try{const d=await api('/echo/keywords');keywords.innerHTML=d.items.map(k=>`<span class="chip">${esc(k.keyword)} · ${k.weight}<button class="x" onclick="removeKeyword('${k.id}')">×</button></span>`).join('')}catch(e){toast(e.message)}}async function loadObjectives(){try{const d=await api('/echo/objectives');objectives.innerHTML=d.items.map(o=>`<div class="objective"><button class="x" onclick="removeObjective('${o.id}')">×</button><b>Priority ${o.priority}</b><div>${esc(o.objective)}</div></div>`).join('')}catch(e){toast(e.message)}}
async function addSource(){const username=sourceInput.value.trim();if(!username)return;try{await api('/echo/sources',{method:'POST',headers:adminHeaders(),body:JSON.stringify({username})});sourceInput.value='';await loadSources();toast('Source added')}catch(e){toast(e.message)}}async function removeSource(id){try{await api('/echo/sources/'+id,{method:'DELETE',headers:adminHeaders()});await loadSources();toast('Source removed')}catch(e){toast(e.message)}}async function addKeyword(){const keyword=keywordInput.value.trim(),weight=Number(weightInput.value||25);if(!keyword)return;try{await api('/echo/keywords',{method:'POST',headers:adminHeaders(),body:JSON.stringify({keyword,weight})});keywordInput.value='';await loadKeywords();toast('Keyword added')}catch(e){toast(e.message)}}async function removeKeyword(id){try{await api('/echo/keywords/'+id,{method:'DELETE',headers:adminHeaders()});await loadKeywords();toast('Keyword removed')}catch(e){toast(e.message)}}async function addObjective(){const objective=objectiveInput.value.trim(),priority=Number(priorityInput.value||50);if(!objective)return;try{await api('/echo/objectives',{method:'POST',headers:adminHeaders(),body:JSON.stringify({objective,priority})});objectiveInput.value='';await loadObjectives();toast('Objective added')}catch(e){toast(e.message)}}async function removeObjective(id){try{await api('/echo/objectives/'+id,{method:'DELETE',headers:adminHeaders()});await loadObjectives();toast('Objective removed')}catch(e){toast(e.message)}}
loadFeed();loadSources();loadKeywords();loadObjectives();setInterval(loadFeed,60000);
</script></body></html>
